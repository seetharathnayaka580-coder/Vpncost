<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Server stack icon with shield/security accent -->
  <g transform="translate(96, 96)">
    <!-- Top Server Blade -->
    <rect x="20" y="40" width="280" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <circle cx="50" cy="70" r="8" fill="#10b981" />
    <circle cx="75" cy="70" r="8" fill="#38bdf8" />
    <circle cx="100" cy="70" r="8" fill="#6366f1" />
    <line x1="140" y1="70" x2="260" y2="70" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    
    <!-- Middle Server Blade -->
    <rect x="20" y="125" width="280" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <circle cx="50" cy="155" r="8" fill="#10b981" />
    <circle cx="75" cy="155" r="8" fill="#38bdf8" />
    <circle cx="100" cy="155" r="8" fill="#6366f1" />
    <line x1="140" y1="155" x2="260" y2="155" stroke="#334155" stroke-width="6" stroke-linecap="round" />

    <!-- Bottom Server Blade -->
    <rect x="20" y="210" width="280" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <circle cx="50" cy="240" r="8" fill="#10b981" />
    <circle cx="75" cy="240" r="8" fill="#38bdf8" />
    <circle cx="100" cy="240" r="8" fill="#6366f1" />
    <line x1="140" y1="240" x2="260" y2="240" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    
    <!-- Lock / VPN badge in corner -->
    <circle cx="250" cy="240" r="32" fill="#0284c7" stroke="#ffffff" stroke-width="4" />
    <path d="M242 236 v-6 a8 8 0 0 1 16 0 v6 h4 v14 h-24 v-14 z" fill="#ffffff" />
  </g>
</svg>
